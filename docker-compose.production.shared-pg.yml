# Produção na VPS usando Postgres existente (Lexius Cobrança no Coolify).
# Variável obrigatória: DATABASE_URL (host = nome/ID do container na rede Coolify).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      INTER_USE_MOCK: 'false'
      COB_EMPRESA_CNPJ: ${COB_EMPRESA_CNPJ:-00000000000191}
      COB_INTEGRACAO_API_KEY: ${COB_INTEGRACAO_API_KEY:-change-me}
      COB_INTEGRACAO_HMAC_SECRET: ${COB_INTEGRACAO_HMAC_SECRET:-change-me}
      RUN_DB_MIGRATE: ${RUN_DB_MIGRATE:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - app_storage:/app/storage

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ''
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${COOLIFY_PORT:-8080}:80'

volumes:
  app_storage: