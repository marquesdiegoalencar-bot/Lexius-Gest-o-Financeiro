# Produção na VPS usando Postgres existente (Lexius Cobrança no Coolify).
# Variáveis: DATABASE_URL (host = container Postgres na rede Coolify; senha URL-encoded)
# Opcional: COOLIFY_DB_NETWORK = nome da rede Docker do Postgres (ex.: coolify ou t139wmk...)
networks:
  default:
  coolify-db:
    external: true
    name: ${COOLIFY_DB_NETWORK:-coolify}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      INTER_USE_MOCK: 'false'
      COB_EMPRESA_CNPJ: ${COB_EMPRESA_CNPJ:-00000000000191}
      COB_INTEGRACAO_API_KEY: ${COB_INTEGRACAO_API_KEY:-}
      COB_INTEGRACAO_HMAC_SECRET: ${COB_INTEGRACAO_HMAC_SECRET:-}
      RUN_DB_MIGRATE: ${RUN_DB_MIGRATE:-true}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - app_storage:/app/storage
    networks:
      - default
      - coolify-db

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ''
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${COOLIFY_PORT:-8080}:80'

volumes:
  app_storage: