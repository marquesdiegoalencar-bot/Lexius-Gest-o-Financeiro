name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  build-test-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexius_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lexius_financeiro_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lexius_financeiro_test
      JWT_SECRET: ci-jwt-secret-minimo-32-caracteres-xxxx
      COB_INTEGRACAO_API_KEY: ci-cob-api-key
      COB_INTEGRACAO_HMAC_SECRET: ci-hmac-secret
      COB_EMPRESA_CNPJ: '00000000000191'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e